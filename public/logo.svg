<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#0f0f23"/>
  <!-- Racing flag -->
  <rect x="6" y="8" width="14" height="10" rx="1" fill="#00d4aa" opacity="0.9"/>
  <rect x="6" y="8" width="7" height="5" fill="#0f0f23"/>
  <rect x="13" y="13" width="7" height="5" fill="#0f0f23"/>
  <!-- Flag pole -->
  <line x1="6" y1="6" x2="6" y2="26" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Speed lines -->
  <line x1="22" y1="10" x2="28" y2="10" stroke="#00d4aa" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="22" y1="16" x2="26" y2="16" stroke="#00d4aa" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="22" y1="22" x2="27" y2="22" stroke="#00d4aa" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
